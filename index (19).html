function gInfo(key){const meta=GLIST.find(x=>x.key===key)||{};if(GX[key])return{name:GX[key].name,ex:GX[key].ex,unit:null,j:meta.j,k:meta.k};
 const [l,n]=key.split('-'),u=+n-1,un=U[l][u];return{name:un.grammar.name,ex:un.grammar.ex,unit:{l,u,t:un.t,cefr:lvOf(l).cefr},j:meta.j,k:meta.k}}

/* overrides: grammar views keyed by material */
function gTable(t){const say=t.say||[t.head.length-1];
 return `<div class="gtable"><h3>${esc(t.title)}</h3><table class="rtable"><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map((c,ci)=>`<td data-label="${esc(t.head[ci])}">${say.includes(ci)&&c!=='—'?`<button class="say" data-act="say" data-t="${esc(c.replace(/"/g,''))}">${ic('vol',15)}<span>${esc(c)}</span></button>`:ci===1&&t.head.length===3&&/^(am|is|are|have|has|was|were)$/i.test(c)?`<b class="hl">${esc(c)}</b>`:esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function gLesson(){const L=GL[view.key],g=gInfo(view.key);let k=1;const step=t=>`<p class="eyebrow step"><span>${k++}</span>${t}</p>`;
 const html=`<section class="card">${step('Materi')}<p class="gnote">${esc(L.intro)}</p>${L.tables.map(gTable).join('')}</section>
 ${L.forms.length?`<section class="card">${step('Pola kalimat')}<div class="forms">${L.forms.map(f=>`<div class="form"><span class="fl">${esc(f[0])}</span><span class="fp">${esc(f[1])}</span><button class="say" data-act="say" data-t="${esc(f[2])}">${ic('vol',15)}<span>${esc(f[2])}</span></button></div>`).join('')}</div></section>`:''}
 <section class="card">${step('Kesalahan yang sering terjadi')}<div class="mists">${L.mist.map(m=>`<div class="mist"><span class="wrong">${ic('x',16)}<s>${esc(m[0])}</s></span><button class="say right" data-act="say" data-t="${esc(m[1])}">${ic('check',16)}<span>${esc(m[1])}</span></button></div>`).join('')}</div>
 ${L.tips.length?`<div class="tips"><b>Ingat</b><ul>${L.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}</section>
 <section class="card">${step('Contoh kalimat')}<div class="exs">${g.ex.map(e=>`<button class="ex" data-act="say" data-t="${esc(e)}">${ic('vol',18)}<span>${esc(e)}</span></button>`).join('')}</div></section>`;GSTEP=k;return html}
function newGramRun(key){return{skill:'grammar',key,opts:GQ[key].map(q=>shuffle(q.slice(1).map((t,i)=>({t,ok:i===0})))),ans:{},checked:false}}
const JLV={SD:'a1',SMP:'b1',SMA:'c1'};
function grammarHome(){const j=S.gj||'SD',items=GLIST.filter(x=>x.j===j),gnum=k=>+k.match(/\d+/)[0],groups=[...new Set(items.map(x=>gnum(x.k)))];

function gcol(){const C=COLS[view.c];
 return `<div class="lhead"><button class="btn ghost icon" data-act="grammar" aria-label="Kembali ke daftar tata bahasa">${ic('back')}</button><div><p class="eyebrow">Tata bahasa · ${esc(C.sub)}</p><h1 class="h2">${esc(C.name)}</h1><p class="muted">${esc(C.desc)}</p></div></div>
 ${C.groups.map(([title,items])=>`<section><h2 class="sec">${esc(title)}</h2><div class="glist">${items.map(([key,label])=>{const g=gInfo(key);return `<button class="gitem" data-act="gpoint" data-key="${key}" data-from="${view.c}"><span class="ubody"><b>${esc(label)}</b>${label.indexOf(g.name)<0?`<span class="muted">${esc(g.name)}</span>`:''}</span>${starRow(S.gram[key]||0,16)}</button>`}).join('')}</div></section>`).join('')}`}

const _grammarHomeBase=grammarHome;
grammarHome=function(){const base=_grammarHomeBase();const i=base.indexOf('<div class="levels"');
 const cards=`<div class="colcards">${Object.entries(COLS).map(([id,C],n)=>{const ks=colKeys(id),d=ks.filter(k=>(S.gram[k]||0)>=1).length;return `<button class="colcard c${n?3:1}" data-act="gcol" data-c="${id}"><span class="tk">${esc(C.sub)}</span><b>${esc(C.name)}</b><span class="muted">${esc(C.desc)}</span><span class="colprog">${d}/${ks.length} materi selesai ${ic('next',16)}</span></button>`}).join('')}</div><h2 class="sec" style="margin-top:6px">Per jenjang sekolah</h2>`;
 return base.slice(0,i)+cards+base.slice(i)};
const _gpointBase=gpoint;
gpoint=function(){let h=_gpointBase();if(view.from&&COLS[view.from]){h=h.replace('data-act="grammar" aria-label="Kembali ke daftar tata bahasa"',`data-act="gcol" data-c="${view.from}" aria-label="Kembali ke ${esc(COLS[view.from].name)}"`);
  const ks=colKeys(view.from),i=ks.indexOf(view.key);if(i>=0&&i<ks.length-1){const nk=ks[i+1];h+=`<div class="row"><button class="btn" data-act="gpoint" data-key="${nk}" data-from="${view.from}">Materi berikutnya: ${esc(gInfo(nk).name)} ${ic('next',18)}</button></div>`}}
 return h};

 <div class="levels" role="group" aria-label="Pilih kelompok kosakata">${tabs.map(x=>{const n=THEMES.filter(t=>t.j===x.id),d=n.filter(t=>(S.vocab[t.id]||0)>=1).length;return `<button class="lvl" data-act="vj" data-j="${x.id}" data-lv="${({SD:'a1',SMP:'b1',SMA:'c1',POS:'b2'})[x.id]}" aria-pressed="${x.id===j}"><b>${x.name}</b><span>${x.full.split(' · ')[1]}</span><small>${d}/${n.length} tema</small></button>`}).join('')}</div>
 ${groups.map(g=>`<section><h2 class="sec">${esc(g)}</h2><div class="themes">${ts.filter(x=>gkey(x.t)===g).map(({t,i})=>`<button class="theme c${i%6}" data-act="theme" data-i="${i}"><span class="tk">${isPos?'Cocok untuk '+esc(t.src):esc(t.k)+' · '+esc(t.src)}</span><span class="tname"><b>${esc(t.name)}</b><span class="muted">${esc(t.en)} · ${t.words.length} kata</span></span><span class="tsample">${(()=>{const em=t.words.map(w=>emo(t.id,w[0])).filter(Boolean);return em.length>=3?'<span class="temo">'+em.slice(0,5).join(' ')+'</span>':''})()}${t.words.slice(0,4).map(w=>esc(w[0])).join(' · ')}</span>${starRow(S.vocab[t.id]||0,16)}</button>`).join('')}</div></section>`).join('')}
 <p class="srcnote">Tema per jenjang disusun mengikuti buku siswa Bahasa Inggris Kurikulum Merdeka terbitan Kemendikbudristek: <i>My Next Words</i> (SD), <i>English for Nusantara</i> (SMP), serta buku kelas X, XI, dan XII untuk SMA. Daftar kata di sini dirangkum untuk latihan, bukan salinan isi buku. Bukunya bisa dibaca gratis di <a href="https://buku.kemdikbud.go.id" target="_blank" rel="noopener">buku.kemdikbud.go.id</a>.</p>`}

S.conv=S.conv||{};
let convTr=true,convPlaying=-1;

/* two voices: different voices when available, otherwise different pitch */
function speakLine(text,who,onend){if(!hasTTS){onend&&onend();return}
 try{const u=new SpeechSynthesisUtterance(text);const lang=S.accent==='UK'?'en-gb':'en-us';
  const vs=voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang));const pool=vs.length?vs:voices.filter(v=>/^en/i.test(v.lang));
  const v=pool.length>1?pool[who==='A'?0:1]:pool[0];if(v)u.voice=v;u.lang=S.accent==='UK'?'en-GB':'en-US';u.rate=0.9;u.pitch=pool.length>1?1:(who==='A'?1.15:0.85);
  u.onend=()=>onend&&onend();u.onerror=()=>onend&&onend();speechSynthesis.speak(u)}catch(e){onend&&onend()}}
function stopSpeech(){convPlaying=-1;try{speechSynthesis.cancel()}catch(e){}}
function playConv(from){const c=CONV[view.i];stopSpeech();let i=from||0;const token={};playConv.t=token;
 const step=()=>{if(playConv.t!==token)return;document.querySelectorAll('.bub.playing').forEach(b=>b.classList.remove('playing'));
  if(i>=c.lines.length){convPlaying=-1;const b=document.getElementById('playall');if(b)b.innerHTML=ic('play',18)+'Putar seluruh percakapan';return}
  convPlaying=i;const el=document.getElementById('bub'+i);if(el){el.classList.add('playing');try{el.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}
  const [w,t]=c.lines[i];i++;speakLine(t,w,()=>setTimeout(step,250))};
 try{speechSynthesis.cancel()}catch(e){}setTimeout(step,80)}

function bubble(c,line,i,opts={}){const [w,t,id]=line;const hide=opts.hide;
 return `<div class="bubrow ${w==='A'?'left':'right'}"><span class="who">${esc(c.who[w])}${opts.me?' (kamu)':''}</span><button class="bub ${w==='A'?'a':'b'}" id="bub${i}" data-act="cline" data-i="${i}">${hide?`<span class="hidden-line">${ic('eye',16)}Ketuk "Lihat kalimat" kalau perlu bantuan</span>`:`<span class="en">${esc(t)}</span>${convTr&&!opts.noTr?`<span class="id">${esc(id)}</span>`:''}`}</button></div>`}

 return `${topbar()}
 <div class="pagehead"><p class="eyebrow">Daily conversation</p><h1>Latihan percakapan sehari-hari</h1><p class="muted">${CONV.length} percakapan untuk situasi sehari-hari, dari menyapa guru sampai wawancara beasiswa. Dengarkan dialognya, lalu bermain peran: aplikasi menjadi lawan bicaramu.</p></div>
 <div class="levels" role="group" aria-label="Pilih jenjang">${JENJANG.map(x=>{const n=CONV.filter(c=>c.j===x.id),d=n.filter(c=>(S.conv[c.id]||0)>=1).length;return `<button class="lvl" data-act="cj" data-j="${x.id}" data-lv="${JLV[x.id]}" aria-pressed="${x.id===j}"><b>${x.name}</b><span>${x.full.split(' · ')[1]}</span><small>${d}/${n.length} dialog</small></button>`}).join('')}</div>
 ${groups.map(g=>`<section><h2 class="sec">Kelas ${g}</h2><div class="themes">${items.filter(x=>gnum(x.c.k)===g).map(({c,i})=>`<button class="theme c${(i+2)%6}" data-act="conv" data-i="${i}"><span class="tk">${esc(c.k)} · ${c.lines.length} kalimat</span><span class="tname"><b>${esc(c.name)}</b><span class="muted">${esc(c.title)}</span></span><span class="tsample">${esc(c.lines[0][1])}</span>${starRow(S.conv[c.id]||0,16)}</button>`).join('')}</div></section>`).join('')}`}

function convPage(){const c=CONV[view.i];
 return `<div class="lhead"><button class="btn ghost icon" data-act="convs" aria-label="Kembali ke daftar percakapan">${ic('back')}</button><div><p class="eyebrow">${c.j} ${esc(c.k)} · Daily conversation</p><h1 class="h2">${esc(c.name)}</h1><p class="muted">${esc(c.title)} · ${esc(c.who.A)} dan ${esc(c.who.B)}</p></div></div>

function rolePage(){const c=CONV[run.ci];const head=`<div class="lhead"><button class="btn ghost icon" data-act="conv" data-i="${run.ci}" aria-label="Kembali ke percakapan">${ic('back')}</button><div><p class="eyebrow">Role play</p><h1 class="h2">${esc(c.name)}</h1></div></div>`;
 if(!run.role)return `${head}<section class="card"><h2 class="sec">Pilih peranmu</h2><p class="muted">Kamu akan mengucapkan semua kalimat milik peran yang kamu pilih. Aplikasi mengucapkan bagian lawan bicaramu.</p>
  <div class="opts">${['A','B'].map(w=>`<button class="opt rolepick ${w==='A'?'ra':'rb'}" data-act="rpickrole" data-w="${w}"><span><b>${esc(c.who[w])}</b><br><small>${c.lines.filter(l=>l[0]===w).length} kalimat untukmu</small></span>${ic('user',22)}</button>`).join('')}</div>
  <label class="toggle"><input type="checkbox" id="rhide" ${run.hide?'checked':''}> Tantangan: sembunyikan kalimatku (hanya tampil terjemahan)</label></section>`;
 const mine=c.lines.map((l,i)=>i).filter(i=>c.lines[i][0]===run.role),n=mine.length;
 if(run.result)return head+dotsBar(n,n,-1)+miniResult(run.result,`data-act="rstart"`,`data-act="conv" data-i="${run.ci}"`);
 const i=run.step,line=c.lines[i],isMe=line[0]===run.role,done=mine.filter(x=>x<i).length;
 const past=c.lines.slice(Math.max(0,i-3),i).map((l,k)=>bubble(c,l,Math.max(0,i-3)+k,{me:l[0]===run.role,noTr:true})).join('');
 return `${head}${dotsBar(n,done,isMe?done:-1)}
 <section class="card chat"><div class="dialog">${past}
 ${isMe?`<div class="bubrow ${line[0]==='A'?'left':'right'}"><span class="who">${esc(c.who[line[0]])} (kamu)</span><div class="bub me ${line[0]==='A'?'a':'b'}" id="bub${i}">${run.hide&&!run.show?`<span class="id">${esc(line[2])}</span><span class="hidden-line">Ucapkan dalam bahasa Inggris</span>`:`<span class="en">${esc(line[1])}</span><span class="id">${esc(line[2])}</span>`}</div></div>`:bubble(c,line,i,{noTr:!convTr})}
 </div></section>
 ${isMe?`<section class="card"><p class="qtext">Giliranmu! Ucapkan kalimatmu dengan suara keras.</p>
  <div class="row">${run.hide&&!run.show?`<button class="btn ghost" data-act="rshow">${ic('eye',18)}Lihat kalimat</button>`:''}<button class="btn ghost" data-act="say" data-t="${esc(line[1])}">${ic('vol',18)}Dengar contoh</button><button class="btn ghost" data-act="say" data-t="${esc(line[1])}" data-rate="slow">${ic('slow',18)}Pelan</button></div>
  <div><p class="label">Seberapa lancar kamu mengucapkannya?</p><div class="rate">${[1,2,3].map(k=>`<button data-act="rrate" data-n="${k}" aria-pressed="${run.scores[i]!=null&&Math.round(run.scores[i]*3)===k}"><span>${[1,2,3].map(x=>starIc(x<=k,18)).join('')}</span><small>${['Masih susah','Hampir lancar','Lancar'][k-1]}</small></button>`).join('')}</div></div>
  <div><button class="btn tint" data-act="rnext" ${run.scores[i]==null?'disabled':''}>${i===c.lines.length-1?'Lihat hasil':'Lanjut'}</button></div></section>`
 :`<section class="card"><div class="row"><button class="btn ghost" data-act="rreplay">${ic('vol',18)}Dengar lagi</button><button class="btn tint" data-act="rnext">${i===c.lines.length-1?'Lihat hasil':'Lanjut'}</button></div></section>`}`}

 if(run.result)return head+dotsBar(n,n,-1)+miniResult(run.result,`data-act="cqstart"`,`data-act="conv" data-i="${run.ci}"`);

 <div class="opts one">${it.opts.map((o,oi)=>{let cls='';if(p!=null){if(o.ok)cls='ok';else if(p===oi)cls='no'}return `<button class="opt ${cls}" data-act="cqpick" data-o="${oi}" ${p!=null?'disabled':''}><span>${esc(o.t)}</span>${p!=null&&o.ok?ic('check',18):p===oi?ic('x',18):''}</button>`}).join('')}</div>

$app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,d=el.dataset;
 switch(a){
 case 'starter':{if(!run||run.skill!=='writing')break;const F=UNIT().writing.free,s=F.start[+d.i].replace(/…/g,' ').replace(/\s+/g,' ').trim();const ta=document.getElementById('free');const cur=(ta?ta.value:run.free).replace(/\s+$/,'');run.free=(cur?cur+' ':'')+s+(/[.!?,]$/.test(s)?' ':' ');render();const t2=document.getElementById('free');if(t2){t2.focus();try{t2.setSelectionRange(t2.value.length,t2.value.length)}catch(err){}}break}

 case 'ctr':convTr=!convTr;render();break;
 case 'playall':if(convPlaying>=0){stopSpeech();playConv.t=null;render()}else{el.innerHTML=ic('x',18)+'Hentikan';playConv(0)}break;
 case 'cline':{if(view.name==='conv'){playConv.t=null;stopSpeech();}const c=CONV[view.name==='conv'?view.i:run.ci],l=c.lines[+d.i];try{speechSynthesis.cancel()}catch(err){}speakLine(l[1],l[0]);break}
 case 'rstart':{const ci=view.name==='conv'?view.i:run.ci;stopSpeech();run={skill:'role',ci,role:null,step:0,scores:{},hide:false,show:false};go({name:'role'});break}
 case 'rpickrole':{run.role=d.w;run.step=0;run.show=false;const cb=document.getElementById('rhide');if(cb)run.hide=cb.checked;render();roleSpeakCurrent();break}
 case 'rshow':run.show=true;render();break;
 case 'rreplay':{const l=CONV[run.ci].lines[run.step];try{speechSynthesis.cancel()}catch(err){}speakLine(l[1],l[0]);break}
 case 'rrate':run.scores[run.step]=(+d.n)/3;render();break;
 case 'rnext':{const c=CONV[run.ci];if(run.step>=c.lines.length-1){const mine=c.lines.map((l,i)=>i).filter(i=>c.lines[i][0]===run.role);const avg=mine.reduce((s,i)=>s+(run.scores[i]||0),0)/mine.length;const r=award(Math.round(avg*100));convScore(r);run.result=r;render();window.scrollTo(0,0)}else{run.step++;run.show=false;try{speechSynthesis.cancel()}catch(err){}render();roleSpeakCurrent()}break}
 case 'cqstart':{const ci=view.name==='conv'?view.i:run.ci;stopSpeech();run=newConvQuiz(ci);go({name:'cquiz'});break}
 case 'cqpick':{run.picked=+d.o;const it=run.items[run.i];if(it.opts[run.picked].ok)run.correct++;const ok=it.opts.find(o=>o.ok).t;if(/[a-z]{3}/i.test(ok)&&!/^(saya|tiga|kalau|cepat|belok|jalan)/i.test(ok))speak(ok);render();break}
 case 'cqnext':{const n=run.items.length;if(run.i===n-1){const r=award(Math.round(run.correct/n*100));convScore(r);run.result=r}else{run.i++;run.picked=null}render();window.scrollTo(0,0);break}
 }});

/* ---------- gender-matched voices for each character ---------- */
const GENDER={'c-greet':{A:'m',B:'f'},'c-friend':{A:'m',B:'f'},'c-canteen':{A:'m',B:'f'},'c-class':{A:'f',B:'m'},'c-morning':{A:'f',B:'m'},'c-doctor':{A:'m',B:'f'},'c-shop':{A:'m',B:'f'},'c-holiday':{A:'m',B:'f'},'c-intro':{A:'f',B:'m'},'c-direction':{A:'m',B:'f'},'c-invite':{A:'m',B:'f'},'c-sorry':{A:'f',B:'m'},'c-phone':{A:'m',B:'f'},'c-hoax':{A:'f',B:'m'},'c-project':{A:'m',B:'f'},'c-debate':{A:'f',B:'m'},'c-complain':{A:'f',B:'m'},'c-interview':{A:'m',B:'f'}};
const FEM_N=/google us english|samantha|victoria|karen|moira|tessa|fiona|serena|kate|susan|zira|aria|jenny|libby|sonia|hazel|emma|ava|allison|joanna|salli|kimberly|natasha|clara|michelle|catherine|martha|nicky|shelley|sandy|flo|grandma/i;
const MALE_N=/daniel|alex\b|fred|arthur|oliver|aaron|david|mark|guy|ryan|thomas|rishi|james|george|brian|matthew|justin|eric|christopher|roger|steffan|gordon|lee|rocko|reed|eddy|grandpa/i;
function voiceGender(v){const n=v.name||'';if(/female/i.test(n))return 'f';if(/\bmale\b/i.test(n))return 'm';if(FEM_N.test(n))return 'f';if(MALE_N.test(n))return 'm';return '?'}
function voiceFor(g){if(!voices.length)loadVoices();const lang=S.accent==='UK'?'en-gb':'en-us';
 const norm2=v=>(v.lang||'').replace('_','-').toLowerCase();const local=voices.filter(v=>norm2(v).startsWith(lang)),anyEn=voices.filter(v=>/^en/.test(norm2(v)));
 const hit=local.find(v=>voiceGender(v)===g)||anyEn.find(v=>voiceGender(v)===g);
 if(hit)return{voice:hit,pitch:g==='f'?1.05:0.95};
 /* no matching voice on this device: use the default English voice and shift the pitch */
 const base=local[0]||anyEn[0]||null,bg=base?voiceGender(base):'?';
 if(g==='m')return{voice:base,pitch:bg==='m'?0.95:0.6};
 return{voice:base,pitch:bg==='f'?1.05:1.45}}
function speakLine(text,who,onend){if(!hasTTS){onend&&onend();return}
 try{const c=view.name==='conv'?CONV[view.i]:(run&&run.ci!=null?CONV[run.ci]:null);const g=(c&&GENDER[c.id]&&GENDER[c.id][who])||(who==='A'?'m':'f');
  const pick=voiceFor(g);const u=new SpeechSynthesisUtterance(text);if(pick.voice)u.voice=pick.voice;u.lang=S.accent==='UK'?'en-GB':'en-US';u.rate=0.9;u.pitch=pick.pitch;
  u.onend=()=>onend&&onend();u.onerror=()=>onend&&onend();speechSynthesis.speak(u)}catch(e){onend&&onend()}}
